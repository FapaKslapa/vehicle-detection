[project]
name = "vehicle-detection"
version = "0.1.0"
description = "Vehicle detection and traffic counting from drone-captured aerial images (TRANSSET)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "opencv-python-headless",
    "pillow",
    "pyyaml",
    "tqdm",
    "torch",
    "torchvision",
    "torchmetrics",
    "pycocotools",
    "ultralytics",
    "sahi",
    "fiftyone",
    "wandb",
    "hydra-core",
]

[project.optional-dependencies]
demo = ["streamlit", "gradio"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "nbstripout",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_detection"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
